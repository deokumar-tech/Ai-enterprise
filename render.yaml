# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# Links Render Web Service with Supabase Backend & Database
# ==============================================================================
services:
  - type: web
    name: nexusai-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://nexusai.vercel.app
      
      # Supabase Connection Pooler (Port 6543)
      - key: DATABASE_URL
        sync: false
      
      # Supabase API Credentials
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      # Google Gemini AI & JWT Secrets
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
