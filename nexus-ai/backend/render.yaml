# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# Links Render Web Service with Supabase Backend & Database
# ==============================================================================
services:
  - type: web
    name: nexusai-backend
    runtime: node
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://nexusai.vercel.app # Update with your Vercel URL
      
      # Supabase Connection Pooler (Port 6543)
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: postgresql://postgres.xxx:pass@aws-0-region.pooler.supabase.com:6543/postgres?pgbouncer=true
      
      # Supabase API Credentials
      - key: SUPABASE_URL
        sync: false # e.g. https://your-project.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      # Google Gemini AI & JWT Secrets
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

